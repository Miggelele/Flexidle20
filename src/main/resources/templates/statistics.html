
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Statistics</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">

</head>
<body id="statistics" class="statistics-style">

<h1>Statistics</h1>

<div>
    <h3>Language</h3>
    <br>
    <div class="statistics-flag-bar">🇸🇪</div>
    <div class="statistics-flag-bar">🇬🇧</div>
    <div class="statistics-flag-bar">🇩🇪</div>
</div>
<br>

<div>
    <h3>Global statistics</h3>
    <br>
    <div class="statistics-diagram-bar">
        <h5 class="statistics-diagram-bar-text">Wordlength: 4</h5>
        <div class="statistics-circle-diagram"></div>
        <h5 class="statistics-diagram-bar-text">Wordlength: 5</h5>
        <div class="statistics-circle-diagram"></div>
        <h5 class="statistics-diagram-bar-text">Wordlength: 6</h5>
        <div class="statistics-circle-diagram"></div>
    </div>
</div>
<br>

<div>
    <h3>Personal statistics</h3>
    <br>
    <div class="statistics-diagram-bar">
        <h5 class="statistics-diagram-bar-text">Wordlength: 4</h5>
        <div class="statistics-circle-diagram"></div>
        <h5 class="statistics-diagram-bar-text">Wordlength: 5</h5>
        <div class="statistics-circle-diagram"></div>
        <h5 class="statistics-diagram-bar-text">Wordlength: 6</h5>
        <div class="statistics-circle-diagram" data-value="5"></div>
    </div>
</div>


</body>
</html>
