<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>start</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Playfair+Display:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="background">
<div class="start-display">
    <img th:src="@{/images/logo-prototype.png}" alt="Flexidle" width="400px" class="margins-home">
    <a href="/settings" class="btn btn-start">PLAY</a>
    <button class="btn btn-start" data-bs-toggle="modal" data-bs-target="#log-in">
        LOG IN
    </button>
    <button class="btn btn-start" data-bs-toggle="modal" data-bs-target="#statistics">
        STATISTICS
    </button>
</div>

<div class="bottom-left">
    <a href="/" class="btn btn-elinsTestFärg">Ta dig tillbaka till index</a>
</div>

<!-- POP-UPP RUTAN AKA MODAL -->
<div class="modal fade" id="log-in" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="wordle-font2">STATISTICS</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            
            <div id="test1">
                <h2>Tryck på knappen</h2>
                <button class="btn btn-start" onclick="logIn('test2')">EN KNAPP</button>
            </div>

            <!-- Vy 2 - gömd från början -->
            <div id="test2" style="display: none;">
                <p>Nu visas något annat</p>
                <button class="btn btn-start" onclick="showView('test1')">Tillbaka</button>
            </div>

        </div>
    </div>
</div>

<div class="modal fade" id="statistics" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="wordle-font2">STATISTICS</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <h1 class="text-font">DU ÄR BÄST OCH VANN ALLA SPEL</h1>
                <br>

            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
