<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>start</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div class="d-flex flex-column align-items-center gap-3">
    <h1></h1>
    <h1 class="wordleFont">FLEXIDLE</h1>
    <h1></h1>
    <h1></h1>
    <a href="/settings" class="btn btn-start">PLAY</a>
    <button class="btn btn-start" data-bs-toggle="modal" data-bs-target="#log-in">
        LOG IN
    </button>
    <button class="btn btn-start" data-bs-toggle="modal" data-bs-target="#statistics">
        STATISTICS
    </button>
</div>

<div style="position: absolute; bottom: 20px; left: 20px;">
    <a href="/" class="btn btn-elinsTestFärg">Ta dig tillbaka till index</a>
</div>

<!-- POP-UPP RUTAN AKA MODAL -->
<div class="modal fade" id="log-in" tabindex="-1">
    <div class="modal-dialog" style="max-width: 600px; margin-top: 80px;">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">LOG IN</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <h1 class="textFont">INGET ÄN</h1>
                <h1></h1>

            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Stäng</button>
            </div>

        </div>
    </div>
</div>

<div class="modal fade" id="statistics" tabindex="-1">
    <div class="modal-dialog" style="max-width: 600px; margin-top: 80px;">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">STATISTICS</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <h1 class="textFont">DU ÄR BÄST OCH VANN ALLA SPEL</h1>
                <h1></h1>

            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Stäng</button>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
