<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexidle</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="gameboard">

<span class="toolbar-style">
    <div class="toolbar-place-left">
        <button class="toolbar-return-button" id="return-button">←</button>
    </div>
    <div class="toolbar-place-right">
        <button class="toolbar-cogwheel-button" id="cogwheel-button"></button>
        <button class="toolbar-statistics-button" id="statistics-button">
            <div class="toolbar-button-area">
                <div class="seg s1"></div>
                <div class="seg s2"></div>
                <div class="seg s3"></div>
            </div>
        </button>
        <button class="toolbar-rules-button" id="rules-button"><b>?</b></button>
        <button class="toolbar-account-button" id="account-button"></button>
    </div>
</span>

<img th:src="@{/images/logo.png}" alt="Flexidle" width="400px">
    <div id= "board"></div>
    <div id="keyboard"></div>

    <script src="/js/app.js"></script>
    <script src="/js/toolbar.js"></script>
</body>
</html>
