<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>start</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Playfair+Display:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/home.js"></script>
</body>

<body class="background">
<div class="start-display">
    <img th:src="@{/images/logo.png}" alt="Flexidle" width="400px">
    <a href="/settings" class="btn btn-start">PLAY</a>
    <a href="#" class="btn btn-start" data-bs-toggle="modal" data-bs-target="#log-in">LOG IN</a>
    <a href="/statistics" class="btn btn-start">STATISTICS</a>
</div>

<<div class="modal fade" id="log-in" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="loginTitle">LOG IN</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <!-- Skriva in användarnamn -->
                <div id="view-username">
                    <p>Enter username:</p>
                    <input type="text" id="usernameInput" class="form-control mb-3" placeholder="Username">
                    <button class="btn btn-start w-100" onclick="checkUsername()">NEXT</button>
                </div>

                <!-- Skriva in lösenord (användaren finns) -->
                <div id="view-password" class="modal-style">
                    <p>Enter your pasword:</p>
                    <input type="password" id="passwordInput" class="form-control mb-3" placeholder="Password">
                    <button class="btn btn-start w-100" onclick="login()">LOGGA IN</button>
                    <button class="btn btn-secondary w-100 mt-2" onclick="showView('view-username')">Back</button>
                </div>

                <!-- Skapa konto (användaren finns inte) -->
                <div id="view-create" class="modal-style">
                    <p>No account found, enter a password:</p>
                    <input type="password" id="newPassword" class="form-control mb-3" placeholder="Password">
                    <select id="securityQuestion" class="form-control mb-3">
                        <option value="" disabled selected>Choose a security question</option>
                        <option value="twilight">Are you team Edward or team Jacob?</option>
                        <option value="mau">What is your preferred lecture hall at MAU?</option>
                        <option value="bts">Your favorite BTS member?</option>
                        <option value="wordle">Is Flexidle better than Wordle?</option>
                        <option value="wow">Horde or Alliance?</option>
                    </select>
                    <input type="text" id="securityAnswer" class="form-control mb-3" placeholder="Your answer">
                    <button class="btn btn-start w-100" onclick="createAccount()">CREATE ACCOUNT</button>
                    <button class="btn btn-secondary w-100 mt-2" onclick="showView('view-username')">BACK</button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
