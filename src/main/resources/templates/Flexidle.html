<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexidle</title>
    <style>
        body {
            font-family: "Times New Roman", sans-serif;
            background: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
        }

        h1 { margin-bottom: 10px; }

         #board{
            display: grid;
            gap: 5px;
            margin-bottom: 20px;
        }
        .tile {
            width: 50px;
            height: 50px;
            border: 2px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            text-transform: uppercase;

        }
        .correctLetter {
            background: #6aaa64;
            border-color: #6aaa64;
            color: #fff;
        }
        .existingLetter {
            background: #c9b458;
            border-color: #c9b458;
            color: #fff;
        }
        .wrongLetter {
            background: #3a3a3c;
            border-color: #3a3a3c;
            color: #fff;
        }

        #keyboard {
            margin-top: 20px;
        }

        .kb-row {
            display: flex;
            justify-content: center;
            margin-bottom: 5px;
        }

        .key{
            background: #444;
            color: #fff;
            border: none;
            margin: 3px;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .action {
            background: pink;
            padding: 12px 14px;
        }


    </style>
</head>
<body>
<h1> Flexidle-logga?</h1>
<div id= "board"></div>
<div id="keyboard"></div>


<script>

    const paramsInput = new URLSearchParams(window.location.search);

    const bgColor = paramsInput.get("bg");
    const tileShape = paramsInput.get("shape");
    const language = paramsInput.get("language");
    const wordLength = parseInt(paramsInput.get("len"));
    const maxGuesses = parseInt(paramsInput.get("guesses"));

    document.body.style.background = bgColor;

    //TODO: generate the word fitting here possibly???

    let answer = "";
    let currentRow = 0;
    let currentCol = 0;
    let gameOver = false;

    const board = document.getElementById("board");
    const keyboard = document.getElementById("keyboard");


    // Random word generator (replace later with language dictionary)
    function randomWord(len) {
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        let w = "";
        for (let i = 0; i < len; i++) {
            w += letters[Math.floor(Math.random() * letters.length)];
        }
        return w;
    }

    function startGame(){
        answer = randomWord(wordLength);

        board.innerHTML = "";
        board.style.gridTemplateColumns = `repeat(${wordLength}, 50px)`;
        board.style.gridTemplateRows = `repeat(${maxGuesses}, 50px)`;

        for (let i = 0; i < wordLength *maxGuesses; i++){
            const tile = document.createElement("div");
            tile.className = "tile";

            if (tileShape === "circle") tile.style.borderRadius = "50%"; //TODO: kolla denna
            if (tileShape === "heart") tile.textContent = "💙";
            if (tileShape === "dog") tile.textContent = "🐶";
            if (tileShape === "diamond") tile.textContent = "🔷";
            if (tileShape === "triangle") tile.textContent = "△";

            board.appendChild(tile);
        }

        buildKeyboard();
    }

    function buildKeyboard(){
        keyboard.innerHTML = "";

        //TODO: beroende på vilket språk, olika keyboards!?
        const keyboardRows = ["QWERTYUIOPÅ", "ASDFGHJKLÖÄ", "ZXCVBNM"];

        keyboardRows.forEach((row, idx) => {
            const rowDiv = document.createElement("div");
            rowDiv.className = "keyboardRow";

            if (idx === 2) {
                const enter = document.createElement("button");
                enter.className = "key action";
                enter.textContent = "ENTER";
                enter.dataset.action = "enter";
                rowDiv.appendChild(enter);
            }

            row.split("").forEach(letter => {
                const btn = document.createElement("button");
                btn.className = "key";
                btn.textContent = letter;
                rowDiv.appendChild(btn);
            });

            if (idx === 2) {
                const back = document.createElement("button");
                back.className = "key action";
                back.textContent = "⌫";
                back.dataset.action = "back";
                rowDiv.appendChild(back);
            }

            keyboard.appendChild(rowDiv);

        });

        document.querySelectorAll(".key").forEach(btn => {
            btn.addEventListener("click", () => pressedKey(btn.textContent, btn.dataset.action));

        });
    }

    function pressedKey(){
        if (gameOver) return;

        if (action === "enter") return submitGuess();
        if (action === "back") return deleteLetter();

        if (/^[A-Ö]$/.test(key)) addLetter(key);
    }

    function addLetter(letter){
        if (currentCol >= wordLength) return;

        const tile = board.children[currentRow * wordLength + currentCol];

        if (["heart","dog","diamond","triangle"].includes(tileShape)) {
            tile.textContent = letter;
        } else {
            tile.textContent = letter;
        }
        currentCol++;
    }

    function deleteLetter() {
        if (currentCol === 0) return;
        currentCol--;

        const tile = board.children[currentRow * wordLength + currentCol];

        if (tileShape === "heart") tile.textContent = "💙";
        else if (tileShape === "dog") tile.textContent = "🐶";
        else if (tileShape === "diamond") tile.textContent = "🔷";
        else if (tileShape === "triangle") tile.textContent = "△";
        else tile.textContent = "";
    }

    function makeGuess(){
        if (currentCol < wordLength) return;

        const guess = [];
        for (let i = 0; i < wordLength; i++) {
            guess.push(board.children[currentRow * wordLength + i].textContent);
        }

        const guessStr = guess.join("");
        const answerArr = answer.split("");
        const guessArr = guess.slice();

        for (let i = 0; i < wordLength; i++) {
            const tile = board.children[currentRow * wordLength + i];
            if (guessArr[i] === answerArr[i]) {
                tile.classList.add("correctLetter");
                answerArr[i] = null;
                guessArr[i] = null;
            }
        }

        for (let i = 0; i < wordLength; i++) {
            const tile = board.children[currentRow * wordLength + i];
            if (guessArr[i] && answerArr.includes(guessArr[i])) {
                tile.classList.add("existingLetter");
                answerArr[answerArr.indexOf(guessArr[i])] = null;
            } else if (guessArr[i]) {
                tile.classList.add("wrongLetter");
            }
        }

        if (guessStr === answer) {
            gameOver = true;
            //TODO: skapa popuppp
            return;
        }
        currentRow++;
        currentCol = 0;

        if (currentRow >= maxGuesses) {
            gameOver = true;
            //TODO: skapa popuppp
        }
    }

    document.addEventListener("keydown", e => {
        if (gameOver) return;

        if (e.key === "Enter") makeGuess();
        else if (e.key === "Backspace") deleteLetter();
        else if (/^[a-öA-Ö]$/.test(e.key)) addLetter(e.key.toUpperCase());
    });

    startGame();


</script>

</body>
</html>
