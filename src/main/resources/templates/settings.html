<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings</title>
    <style>
        body {
            font-family: "Times New Roman", sans-serif;
            background: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        #settings {
            background: #222;
            padding: 20px;
            border-radius: 10px;
        }
        label { display: block; margin: 10px 0; }
        button { margin-top: 15px; padding: 10px 20px; cursor: pointer; }

        .shapeOption {
            display: inline-block;
            font-size: 40px;
            margin: 5px;
            padding: 10px;
            cursor: pointer;
            border: 2px solid #555;
            border-radius: 8px;
        }

        .shapeOption.selected {
            border-color: blue;
            background: #333;
        }

        .wordLengthOption {
            display: inline-block;
            padding: 10px 15px;
            margin: 5px;
            border: 2px solid #555;
            border-radius: 6px;
            cursor: pointer;
            font-size: 20px;
        }

        .wordLengthOption.selected {
            border-color: blue;
            background: #333;

        }

        .nbrOfGuessesOption {
            display: inline-block;
            padding: 10px 15px;
            margin: 5px;
            border: 2px solid #555;
            border-radius: 6px;
            cursor: pointer;
            font-size: 20px;
        }

        .nbrOfGuessesOption.selected {
            border-color: blue;
            background: #333;

        }

        .countryOption {
            display: inline-block;
            padding: 10px 15px;
            margin: 5px;
            border: 2px solid #555;
            border-radius: 6px;
            cursor: pointer;
            font-size: 20px;
        }

        .countryOption.selected {
            border-color: blue;
            background: #333;
        }


    </style>
</head>
<body>

<h1> Settings </h1>
<div id="settings">
    <label>Background Color:
        <input type="color" id="bgColor" value="#111111">
    </label>

    <div class="shape options">
        <div class="optionsLabel">Shapes:</div>
        <div class="shapeOption" data-value="circle">⚪</div>
        <div class="shapeOption" data-value="square">◻️</div>
        <div class="shapeOption" data-value="heart">💙</div>
        <div class="shapeOption" data-value="dog">🐶</div>
        <div class="shapeOption" data-value="diamond">🔷</div>
        <div class="shapeOption" data-value="triangle">△</div>
    </div>

    <div class="country options">
        <div class="countryOptionLabel">Language:</div>
        <div class="countryOption" data-value="swedish">🇸🇪</div>
        <div class="countryOption" data-value="english">🇬🇧</div>
        <div class="countryOption" data-value="german">🇩🇪</div>

    </div>


    <div class="wordLengthOptions">
        <div class="wordLengthoptionLabel">Word Length:</div>
        <div class="wordLengthOption" data-len="4">4</div>
        <div class="wordLengthOption" data-len="5">5</div>
        <div class="wordLengthOption" data-len="6">6</div>
    </div>


    <div class="nbrOfGuessesOptions">
        <div class="nbrOfGuessesOptionLabel">Number of guesses:</div>
        <div class="nbrOfGuessesOption" data-len="4">4</div>
        <div class="nbrOfGuessesOption" data-len="5">5</div>
        <div class="nbrOfGuessesOption" data-len="6">6</div>
    </div>

    <div class="buttonsPlayOrRandom">
        <button onclick="startGame()">PLAY</button>
        <button onclick="chooseRandomSettings()">RANDOMISE ⚄</button>
    </div>

</div>

<script>
    let selectedShape = "square";
    let selectedWordLength = 5;
    let selectedNbrOfGuesses = 5;
    let selectedCountry = "german";

    document.querySelectorAll(".shapeOption").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".shapeOption").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            selectedShape = btn.dataset.value;
        });
    });

    document.querySelectorAll(".countryOption").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".countryOption").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            selectedCountry = btn.dataset.value;
        });
    });


    document.querySelectorAll(".wordLengthOption").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".wordLengthOption").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            selectedWordLength = parseInt(btn.dataset.len);
        });
    });

    document.querySelectorAll(".nbrOfGuessesOption").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".nbrOfGuessesOption").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            selectedNbrOfGuesses = parseInt(btn.dataset.len);
        });
    });



    function startGame() {
        const bg = encodeURIComponent(document.getElementById("bgColor").value);
        const shape = selectedShape;
        const length = selectedWordLength;
        const guesses = selectedNbrOfGuesses;
        const language = selectedCountry;

        window.location.href =
            `Flexidle.html?bg=${bg}&shape=${shape}&language=${language}&len=${length}&guesses=${guesses}`;
    }

    function chooseRandomSettings(){
        //TODO: actually randomise this later
        //so that random alternatives light up and you can choose to PLAY with random settings.

    }
</script>

</body>
</html>
